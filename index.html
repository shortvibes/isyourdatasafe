<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Is Your Data Safe? (.org) - DLP Test Platform</title>
  <style>
    :root {
      --bg: #080c14;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #047857;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
      flex-grow: 1;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    select, button, input {
      font-family: inherit;
    }
    select {
      background: #020617;
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: #334155;
      color: #fff;
    }
    .btn-secondary:hover { background: #475569; }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 0.5rem;
      background: #020617;
      border: 1px solid var(--card-border);
      margin-top: 0.5rem;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-font { font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="font-size: 1.25rem; font-weight: 700;">
        Is Your Data Safe? <span style="color: var(--accent); font-family: monospace;">(.org)</span>
      </h1>
      <p style="font-size: 0.75rem; color: var(--muted);">Global Data & OCR Specimen Benchmark</p>
    </div>
    <div class="badge">● [No Logs - In-Memory Only]</div>
  </header>

  <main>
    <!-- Country Selector -->
    <div class="panel flex-between" style="flex-wrap: wrap; gap: 1rem;">
      <div>
        <label style="font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">
          Select Target Jurisdiction
        </label>
        <p style="font-size: 0.75rem; color: var(--muted);">Generates scannable passport, license, and credit card test artifacts.</p>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <select id="country-selector" onchange="onCountryChange()"></select>
        <button class="btn" onclick="regenerateAllData()">Randomize</button>
      </div>
    </div>

    <!-- Document Cards -->
    <div class="grid">
      <!-- Passport -->
      <div class="panel">
        <div class="flex-between">
          <strong style="color: #38bdf8;">Passport Specimen</strong>
          <span id="passport-code" class="code-font" style="color: var(--muted);">NLD</span>
        </div>
        <canvas id="passport-canvas" width="500" height="340"></canvas>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="downloadCanvas('passport-canvas', 'passport')">
          Download Image
        </button>
      </div>

      <!-- Driver License -->
      <div class="panel">
        <div class="flex-between">
          <strong style="color: #fbbf24;">Driver's License</strong>
          <span id="dl-code" class="code-font" style="color: var(--muted);">NLD</span>
        </div>
        <canvas id="dl-canvas" width="500" height="340"></canvas>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="downloadCanvas('dl-canvas', 'drivers_license')">
          Download Image
        </button>
      </div>

      <!-- Credit Card -->
      <div class="panel">
        <div class="flex-between">
          <strong style="color: #c084fc;">Payment Card (PCI)</strong>
          <select id="cc-brand" onchange="onCcBrandChange()" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">
            <option value="VISA">VISA</option>
            <option value="MASTERCARD">Mastercard</option>
            <option value="AMEX">Amex</option>
          </select>
        </div>
        <canvas id="cc-canvas" width="500" height="340"></canvas>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="downloadCanvas('cc-canvas', 'credit_card')">
          Download Image
        </button>
      </div>
    </div>
  </main>

  <script>
    const COUNTRY_DATA = [
      { code: "NLD", name: "Netherlands", flag: "🇳🇱", title: "KONINKRIJK DER NEDERLANDEN", doc: "SPECi2026", dlTitle: "RIJBEWIJS" },
      { code: "BEL", name: "Belgium", flag: "🇧🇪", title: "BELGIQUE / BELGIË", doc: "TA000000", dlTitle: "PERMIS DE CONDUIRE" },
      { code: "DEU", name: "Germany", flag: "🇩🇪", title: "BUNDESREPUBLIK DEUTSCHLAND", doc: "C01X00000", dlTitle: "FÜHRERSCHEIN" },
      { code: "FRA", name: "France", flag: "🇫🇷", title: "RÉPUBLIQUE FRANÇAISE", doc: "12AA00000", dlTitle: "PERMIS DE CONDUIRE" },
      { code: "ITA", name: "Italy", flag: "🇮🇹", title: "REPUBBLICA ITALIANA", doc: "YA5387192", dlTitle: "PATENTE DI GUIDA" },
      { code: "USA", name: "United States", flag: "🇺🇸", title: "UNITED STATES OF AMERICA", doc: "A12345678", dlTitle: "DRIVER LICENSE" }
    ];

    let currentCountry = COUNTRY_DATA[0];
    let currentCc = "VISA";

    function randNum(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function init() {
      const select = document.getElementById('country-selector');
      select.innerHTML = COUNTRY_DATA.map(c => `<option value="${c.code}">${c.flag} ${c.name} (${c.code})</option>`).join('');
      onCountryChange();
    }

    function onCountryChange() {
      const code = document.getElementById('country-selector').value;
      currentCountry = COUNTRY_DATA.find(c => c.code === code) || COUNTRY_DATA[0];
      regenerateAllData();
    }

    function onCcBrandChange() {
      currentCc = document.getElementById('cc-brand').value;
      regenerateAllData();
    }

    function regenerateAllData() {
      document.getElementById('passport-code').innerText = currentCountry.code;
      document.getElementById('dl-code').innerText = currentCountry.code;

      drawPassport();
      drawDL();
      drawCC();
    }

    function drawPassport() {
      const canvas = document.getElementById('passport-canvas');
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, 500, 340);

      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 0, 500, 48);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`${currentCountry.flag} ${currentCountry.title}`, 15, 28);

      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(20, 65, 110, 140);
      ctx.fillStyle = '#64748b';
      ctx.beginPath(); ctx.arc(75, 115, 25, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(75, 180, 40, 0, Math.PI, true); ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText("SPECIMEN", 145, 95);
      ctx.fillText("EMMA LISANNE", 145, 130);
      ctx.fillText(currentCountry.name.toUpperCase(), 145, 165);
      ctx.fillText(currentCountry.doc, 145, 195);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 235, 500, 105);
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 14px monospace';
      ctx.fillText(`P<${currentCountry.code}SPECIMEN<<EMMA<LISANNE<<<<<<<<<<<<<<<<<<`.substring(0,44), 15, 270);
      ctx.fillText(`${currentCountry.doc}4${currentCountry.code}8412254F2810010<<<<<<<<<<<<<<02`.substring(0,44), 15, 300);
    }

    function drawDL() {
      const canvas = document.getElementById('dl-canvas');
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, 0, 500, 340);

      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(0, 0, 500, 52);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`${currentCountry.flag} ${currentCountry.dlTitle}`, 20, 31);

      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(20, 68, 110, 140);

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText("DE BRUIJN", 150, 110);
      ctx.fillText(`ID: DL-${randNum(100000, 999999)}`, 150, 145);
      ctx.fillText(`TAX: ${randNum(100000000, 999999999)}`, 150, 180);
    }

    function drawCC() {
      const canvas = document.getElementById('cc-canvas');
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 500, 340);

      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(40, 70, 50, 38);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(currentCc, 380, 55);

      ctx.font = 'bold 22px monospace';
      ctx.fillText(`4532 ${randNum(1000,9999)} ${randNum(1000,9999)} ${randNum(1000,9999)}`, 40, 190);

      ctx.font = '14px sans-serif';
      ctx.fillText('VALID THRU: 12/28', 40, 235);
    }

    function downloadCanvas(id, name) {
      const canvas = document.getElementById(id);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `${name}_${currentCountry.code.toLowerCase()}.png`;
      a.click();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
